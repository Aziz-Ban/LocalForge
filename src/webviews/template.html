<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{cssUri}}" rel="stylesheet" />
  </head>
  <body>
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Header -->
    <div class="hdr">
      <div class="brand">
        <div class="brand-i">
          <svg viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
          </svg>
        </div>
        Local Forge
      </div>
      <div class="hdr-r">
        <button class="ib" id="btn-start-all" title="Start All">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
        </button>
        <button class="ib" id="btn-stop-all" title="Stop All">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z" /></svg>
        </button>
        <button class="ib" id="btn-refresh" title="Refresh">
          <svg viewBox="0 0 24 24">
            <path
              d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Main View -->
    <div class="main">
      <!-- Create/Edit Form -->
      <div id="form-card">
        <div class="fc-head">
          <span id="form-title">New Agent</span>
          <button class="ib" id="btn-cancel" title="Cancel">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </div>
        <div class="fc-body">
          <div class="field">
            <label>Agent Name</label>
            <input id="f-name" placeholder="e.g. Code Reviewer" autocomplete="off" />
          </div>
          <div class="field">
            <label>Model &amp; Port</label>
            <div class="row">
              <select id="f-model">
                <option disabled selected>Loading…</option>
              </select>
              <input type="number" id="f-port" value="6009" min="1024" max="65535" title="Port" />
            </div>
          </div>
          <div class="field">
            <label class="tgl">
              <input type="checkbox" id="f-ctx-chk" />System Prompt (Context)
            </label>
            <div class="slide" id="f-ctx-slide">
              <textarea
                id="f-ctx"
                class="ctx"
                placeholder="e.g. You are a senior UI/UX engineer."
              ></textarea>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="btn-form-cancel">Cancel</button>
            <button class="btn btn-go" id="btn-form-save">Create Agent</button>
          </div>
        </div>
      </div>

      <!-- Agent List Container -->
      <div id="agent-list"></div>

      <!-- Empty State -->
      <div id="empty" class="empty">
        <svg viewBox="0 0 24 24">
          <path
            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94L2.84 14.52a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.27.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
          />
        </svg>
        <div style="font-weight: 600; font-size: 14px">No agents yet</div>
        <p>Tap + to create your first AI agent</p>
      </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="fab" title="New Agent">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></svg>
    </button>

    <script src="{{jsUri}}"></script>
  </body>
</html>
